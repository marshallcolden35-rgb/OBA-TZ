<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jisajili | Online Business Academy TZ</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f8fc;margin:0;padding:30px}
.box{max-width:500px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 5px 25px #0002}
h1{color:#123b7a}p{color:#555}
input,select{width:100%;padding:14px;margin:8px 0 15px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:15px;background:#18a875;color:white;border:0;border-radius:10px;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>Jisajili OBA TZ 🎓</h1>
<p>Jaza taarifa zako ili kuanza kujifunza.</p>

<label>Jina Kamili</label>
<input type="text" placeholder="Andika jina lako">
<label>Email</label>
<input type="email" placeholder="Andika email yako">

<label>Password</label>
<input type="password" placeholder="Tengeneza password">
<label>Namba ya Simu</label>
<input type="tel" placeholder="Mfano: 07XXXXXXXX">

<label>Chagua Kozi</label>
<select>
<option>Digital Marketing</option>
<option>Online Business</option>
<option>Social Media Marketing</option>
<option>Graphic Design</option>
<option>Website Development</option>
<option>AI & ChatGPT for Business</option>
</select>

<button type="button" id="registerSubmit">Jisajili Sasa</button>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

<script>
document.getElementById("registerSubmit").onclick = async function () {

  const name = document.querySelector('input[type="text"]').value.trim();
  const email = document.querySelector('input[type="email"]').value.trim();
  const password = document.querySelector('input[type="password"]').value;

  if (!name || !email || !password) {
    alert("Tafadhali jaza taarifa zote.");
    return;
  }

  if (password.length < 6) {
    alert("Password iwe na angalau herufi 6.");
    return;
  }

  const { error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        full_name: name
      }
    }
  });

  if (error) {
    alert("Usajili umeshindikana: " + error.message);
    return;
  }

  alert("Akaunti imetengenezwa! 🎉 Angalia email yako kuthibitisha akaunti.");
};
</script>

</html>
